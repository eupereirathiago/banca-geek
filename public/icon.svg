<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c30"/>
      <stop offset="50%" stop-color="#12121f"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#ffc531"/>
      <stop offset="100%" stop-color="#e09f00"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#9d0208"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.6"/>

  <!-- Comic Badge Frame -->
  <rect x="76" y="76" width="360" height="360" rx="48" fill="url(#red)" filter="url(#shadow)"/>
  <rect x="88" y="88" width="336" height="336" rx="40" fill="none" stroke="url(#gold)" stroke-width="8"/>

  <!-- Corner Accent Screws -->
  <circle cx="106" cy="106" r="6" fill="#ffc531"/>
  <circle cx="406" cy="106" r="6" fill="#ffc531"/>
  <circle cx="106" cy="406" r="6" fill="#ffc531"/>
  <circle cx="406" cy="406" r="6" fill="#ffc531"/>

  <!-- Central "B" Hero Mark -->
  <text x="256" y="340" font-family="'Impact', 'Arial Black', sans-serif" font-size="250" font-weight="900" fill="url(#gold)" text-anchor="middle" filter="url(#shadow)" letter-spacing="-4">B</text>

  <!-- Ribbon Banner -->
  <rect x="120" y="372" width="272" height="42" rx="6" fill="#12121f" stroke="#ffc531" stroke-width="3"/>
  <text x="256" y="400" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#f4ebd8" text-anchor="middle" letter-spacing="4">BANCA GEEK</text>
</svg>
