  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Plataforma de preservação e leitura de quadrinhos clássicos com leitor de alta fidelidade, cronologias oficiais e acervo restaurado." />
    <meta property="og:title" content="Banca Geek Collector Edition" />
    <meta property="og:description" content="Plataforma de preservação e leitura de quadrinhos clássicos com leitor de alta fidelidade, cronologias oficiais e acervo restaurado." />

    <meta name="theme-color" content="#12121F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Gracefully ignore Vite WebSocket HMR errors in iframe/preview environment
      (function() {
        function shouldSuppress(msg, stack, filename) {
          var str = (String(msg || '') + ' ' + String(stack || '') + ' ' + String(filename || '')).toLowerCase();
          return str.includes('websocket') || str.includes('@vite/client') || str.includes('without opened') || str.includes('connection closed');
        }
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e ? e.reason : null;
          var msg = reason ? (reason.message || String(reason)) : '';
          var stack = reason ? (reason.stack || '') : '';
          if (shouldSuppress(msg, stack, '')) {
            e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          var msg = e ? (e.message || '') : '';
          var filename = e ? (e.filename || '') : '';
          var stack = e && e.error ? (e.error.stack || '') : '';
          if (shouldSuppress(msg, stack, filename)) {
            e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-[#12121F] text-[#F4EBD8] antialiased selection:bg-[#FFC531] selection:text-[#12121F] overflow-x-hidden" style="background-color: #12121F;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #12121F; color: #F4EBD8; font-family: 'Manrope', system-ui, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 48px; height: 48px; border: 4px solid #FFC531; border-top-color: transparent; border-radius: 50%; animation: bgSpin 0.75s linear infinite; margin-bottom: 18px;"></div>
        <div style="font-size: 22px; font-weight: 900; letter-spacing: 2px; color: #FFC531; text-transform: uppercase;">BANCA GEEK</div>
        <div style="font-size: 13px; color: #8A8CA5; margin-top: 6px; letter-spacing: 0.5px;">Carregando acervo e conectando ao Supabase Storage...</div>
      </div>
      <style>
        @keyframes bgSpin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clean up any stale service workers in development/preview to prevent caching issues
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname.includes('aistudio') || window.location.hostname.includes('run.app')) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          }).catch(function() {});
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }
      }
    </script>
  </body>
</html>
